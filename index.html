<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kimi-1040: convert song notes to numeric tablature for the QI MEI 1040 chromatic harmonica; export PDF, MIDI, MP3 with synced lyrics. تبدیل نت به تبلچر هارمونیکای کروماتیک">
<meta name="theme-color" content="#0e6ba8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Kimi-1040 — تبدیل نت به تبلچر هارمونیکا | Chromatic Harmonica Tab Converter</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">🎼</span>
    <div>
      <h1 data-i18n="appTitle">تبدیل نت به تبلچر هارمونیکای کروماتیک</h1>
      <div class="sub" data-i18n="appSub">مخصوص QI MEI 1040 — کوک C، ۱۰ خانه، ۴۰ زبانه، با اسلایدر</div>
    </div>
  </div>
  <button id="langBtn" class="langbtn">English</button>
</header>
<p class="tagline" data-i18n="tagline"></p>

<main>
  <section class="panel inputs">
    <nav class="tabs">
      <button class="tabbtn on" data-pane="paneSearch" data-i18n="tabSearch">جستجو در اینترنت</button>
      <button class="tabbtn" data-pane="paneLib" data-i18n="tabLibrary">کتابخانهٔ داخلی</button>
      <button class="tabbtn" data-pane="paneFile" data-i18n="tabFile">فایل MIDI</button>
      <button class="tabbtn" data-pane="panePaste" data-i18n="tabPaste">تایپ نت‌ها</button>
    </nav>

    <div class="tabpane" id="paneSearch">
      <label data-i18n="songName">نام آهنگ:</label>
      <div class="row">
        <input id="query" type="search" placeholder="Ey Iran / مورچه / Ode to Joy / La Vie en Rose…" dir="auto">
        <button id="searchBtn" class="primary" data-i18n="searchBtn">جستجوی بهترین نسخه</button>
      </div>
      <div id="results" class="results"></div>
    </div>

    <div class="tabpane" id="paneLib" hidden>
      <label data-i18n="libSelect">انتخاب آهنگ:</label>
      <div class="row">
        <select id="libSel"></select>
        <button id="libLoad" class="primary" data-i18n="libLoad">بارگذاری</button>
      </div>
    </div>

    <div class="tabpane" id="paneFile" hidden>
      <label data-i18n="fileHint">فایل MIDI:</label>
      <input id="midiFile" type="file" accept=".mid,.midi,audio/midi,audio/x-midi">
    </div>

    <div class="tabpane" id="panePaste" hidden>
      <label data-i18n="pasteHint">نت‌ها:</label>
      <textarea id="pasteArea" dir="ltr" rows="4" placeholder="T:=110 M:=4/4&#10;E4 E4 F4 G4 G4 F4 E4 D4 …"></textarea>
      <button id="pasteLoad" class="primary" data-i18n="pasteLoad">تبدیل کن</button>
    </div>

    <fieldset class="opts">
      <legend data-i18n="options">تنظیمات</legend>
      <div class="optrow">
        <label for="transpose" data-i18n="transpose">ترانسپوز:</label>
        <select id="transpose"></select>
        <label for="tempo" data-i18n="tempo">ضرباهنگ:</label>
        <input id="tempo" type="number" min="20" max="300" step="1" value="120" style="width:5.2em">
      </div>
      <div class="optrow">
        <label class="chk"><input id="minSlide" type="checkbox" checked><span data-i18n="minSlide">کمینه‌کردن اسلایدر</span></label>
        <label class="chk"><input id="showPitch" type="checkbox" checked><span data-i18n="showPitch">نمایش نام نت‌ها</span></label>
      </div>
      <label for="lyrics" data-i18n="lyricsBox">متن آهنگ:</label>
      <textarea id="lyrics" rows="3" dir="auto" data-i18n-ph="lyricsPh"></textarea>
      <button id="convert" class="primary wide" data-i18n="convert">ساخت تبلچر</button>
    </fieldset>
  </section>

  <section class="panel output">
    <div id="info" class="info"></div>
    <div class="row exports">
      <span class="exlabel" data-i18n="exportHdr">خروجی‌ها:</span>
      <button id="expPDF" class="exp pdf">PDF</button>
      <button id="expMIDI" class="exp midi">MIDI</button>
      <button id="expMP3" class="exp mp3">MP3</button>
      <button id="expLRC" class="exp lrc">LRC</button>
      <button id="expJSON" class="exp json">JSON</button>
      <button id="play" class="play" data-i18n="play">پیش‌نوا</button>
      <button id="stop" class="play stop" data-i18n="stop">توقف</button>
    </div>
    <h2 class="pv-title" data-i18n="preview">پیش‌نمایش تبلچر</h2>
    <div id="preview" class="preview" dir="ltr"></div>
    <div id="status" class="status">…</div>
    <p class="foot-note"><span data-i18n="deviceNote"></span><br><span data-i18n="offline"></span></p>
  </section>
</main>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/lame.min.js"></script>
<script src="js/music.js"></script>
<script src="js/harp.js"></script>
<script src="js/midiparse.js"></script>
<script src="js/melody.js"></script>
<script src="js/lyrics.js"></script>
<script src="js/library.js"></script>
<script src="js/search.js"></script>
<script src="js/synth.js"></script>
<script src="js/midiwrite.js"></script>
<script src="js/exportmp3.js"></script>
<script src="js/exportpdf.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
/* transpose select options: auto + -12..+12 */
(function(){
  var s = document.getElementById('transpose');
  var o = document.createElement('option'); o.value='auto'; o.id='optAuto'; s.appendChild(o);
  for (var i=-12;i<=12;i++){ var op=document.createElement('option'); op.value=String(i); op.textContent=(i>0?'+':'')+i; s.appendChild(op); }
  function lab(){ var K=window.K1040; document.getElementById('optAuto').textContent = K.i18n.t('auto')+' ('+K.i18n.t('transpose')+')'; }
  lab(); window.addEventListener('k1040-lang', lab);
})();
</script>
</body>
</html>
